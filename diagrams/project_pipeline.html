<button class="dl-btn" onclick="dlPNG('pl','project_pipeline.png',680,622)">⬇ Download project_pipeline.png</button>
<script>
function dlPNG(id,fn,w,h){
  const sv=document.getElementById(id);
  const c=document.createElement('canvas');
  c.width=w*2;c.height=h*2;
  const x=c.getContext('2d');
  x.fillStyle='#ffffff';x.fillRect(0,0,c.width,c.height);
  x.scale(2,2);
  const d='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(new XMLSerializer().serializeToString(sv));
  const i=new Image();
  i.onload=function(){x.drawImage(i,0,0,w,h);const a=document.createElement('a');a.download=fn;a.href=c.toDataURL('image/png');a.click();};
  i.src=d;
}
</script>
